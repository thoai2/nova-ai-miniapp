<!DOCTYPE html>
<html lang="en">
<head>
    <script src='//libtl.com/sdk.js' data-zone='11624640' data-sdk='show_11624640'></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f12;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 1px solid #29292f;
        }

        .subtitle {
            text-align: center;
            color: #999;
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 15px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .bot {
            background: #24242b;
            margin-right: auto;
        }

        .user {
            background: #6c5ce7;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid #29292f;
            background: #151519;
        }

        input {
            flex: 1;
            border: none;
            outline: none;
            padding: 13px;
            border-radius: 12px;
            background: #25252c;
            color: white;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 0 18px;
            border-radius: 12px;
            background: #6c5ce7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">✨ Nova AI</div>
    <div class="subtitle">Your AI assistant on Telegram</div>

    <div id="chat">
        <div class="message bot">
            Hello! 👋 I'm Nova AI.<br>
            Ask me anything.
        </div>
    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Ask Nova AI..."
            onkeydown="if(event.key === 'Enter') sendMessage()"
        >
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function sendMessage() {
            const input = document.getElementById("message");
            const chat = document.getElementById("chat");

            const text = input.value.trim();

            if (!text) return;

            const userMessage = document.createElement("div");
            userMessage.className = "message user";
            userMessage.textContent = text;

            chat.appendChild(userMessage);

            input.value = "";

            const botMessage = document.createElement("div");
            botMessage.className = "message bot";
            botMessage.textContent =
                "I'm ready 🤖. AI connection will be added in the next step.";

            chat.appendChild(botMessage);

            chat.scrollTop = chat.scrollHeight;
        }
    </script>

</body>
</html>
